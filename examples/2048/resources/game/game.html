<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>2048</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 540px; height: 850px; background: #faf8ef; color: #776e65; font-family: sans-serif; }
main { position: relative; width: 540px; height: 850px; }
.eyebrow { position: absolute; left: 40px; top: 26px; margin: 0; font-size: 11px; letter-spacing: 3px; color: #9c9185; }
h1 { position: absolute; left: 35px; top: 42px; margin: 0; font-size: 80px; line-height: 88px; letter-spacing: -5px; }
.scores { position: absolute; right: 38px; top: 58px; display: flex; gap: 8px; }
.score { min-width: 94px; height: 65px; padding: 8px 12px; border-radius: 7px; background: #bbada0; text-align: center; }
.score-label { display: block; font-size: 11px; color: #eee4da; letter-spacing: 1px; }
.score-value { display: block; margin-top: 3px; color: #fffaf4; font-size: 23px; font-weight: 700; }
.intro { position: absolute; left: 40px; top: 136px; margin: 0; font-size: 16px; }
.toolbar { position: absolute; left: 38px; right: 38px; top: 174px; height: 34px; display: flex; justify-content: space-between; align-items: center; }
.turns { font-size: 12px; color: #9c9185; }
.actions { display: flex; gap: 8px; }
button { height: 34px; padding: 0 16px; border: 0; border-radius: 6px; background: #8f7a66; color: #fffaf4; font-family: sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; }
button:hover { background: #776452; }
button:focus { outline: 2px solid #edc22e; outline-offset: 3px; }
button:disabled { background: #e8e0d5; color: #b4a99c; cursor: default; }
.board { position: absolute; left: 38px; top: 222px; width: 464px; height: 464px; padding: 12px; border-radius: 12px; background: #bbada0; }
.row { display: flex; gap: 12px; height: 101px; margin-bottom: 12px; }
.row:last-child { margin-bottom: 0; }
.tile { flex-shrink: 0; display: flex; justify-content: center; align-items: center; width: 101px; height: 101px; border-radius: 7px; font-size: 44px; font-weight: 700; color: #f9f6f2; }
.row, .tile { pointer-events: none; }
.empty { background: #cdc1b4; color: transparent; }
.v1 { background: #eee4da; color: #776e65; }
.v2 { background: #ede0c8; color: #776e65; }
.v3 { background: #f2b179; }
.v4 { background: #f59563; }
.v5 { background: #f67c5f; }
.v6 { background: #f65e3b; }
.v7 { background: #edcf72; font-size: 39px; }
.v8 { background: #edcc61; font-size: 39px; }
.v9 { background: #edc850; font-size: 39px; }
.v10 { background: #edc53f; }
.v11 { background: #edc22e; }
.v12 { background: #3c3a32; }
.small { font-size: 32px; }
.tiny { font-size: 24px; }
.overlay { position: absolute; left: 0; top: 0; width: 464px; height: 464px; border-radius: 12px; background: rgba(250,248,239,.95); display: flex; flex-direction: column; justify-content: center; align-items: center; }
.overlay[hidden] { display: none; }
.overlay h2 { margin: 0 0 14px; font-size: 34px; color: #776e65; }
.overlay p { margin: 0 0 28px; font-size: 14px; }
.overlay-actions { display: flex; gap: 10px; }
.overlay button { height: 42px; }
button[hidden] { display: none; }
.directions { position: absolute; left: 38px; right: 38px; top: 710px; display: flex; justify-content: center; gap: 10px; }
.directions button { width: 64px; height: 46px; padding: 0; background: #eee4da; color: #776e65; font-size: 24px; }
.directions button:hover { background: #e2d5c5; }
.hint { position: absolute; left: 38px; top: 774px; width: 464px; margin: 0; text-align: center; font-size: 12px; color: #9c9185; }
.status { position: absolute; left: 38px; top: 805px; width: 464px; margin: 0; text-align: center; font-size: 12px; color: #9c9185; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">ONIX / 数字小游戏</p>
  <h1>2048</h1>
  <div class="scores">
    <div class="score"><span class="score-label">得分</span><span class="score-value" id="score">0</span></div>
    <div class="score"><span class="score-label">本次最佳</span><span class="score-value" id="best">0</span></div>
  </div>
  <p class="intro">小小的数字，大大的可能。</p>
  <div class="toolbar">
    <span class="turns">已走 <span id="moves">0</span> 步</span>
    <div class="actions"><button id="undo" type="button" disabled>撤销 Z</button><button id="restart" type="button">新游戏 R</button></div>
  </div>
  <div class="board" aria-label="2048 棋盘">
    <div class="row"><div class="tile empty" id="cell-0"><span id="value-0">0</span></div><div class="tile empty" id="cell-1"><span id="value-1">0</span></div><div class="tile empty" id="cell-2"><span id="value-2">0</span></div><div class="tile empty" id="cell-3"><span id="value-3">0</span></div></div>
    <div class="row"><div class="tile empty" id="cell-4"><span id="value-4">0</span></div><div class="tile empty" id="cell-5"><span id="value-5">0</span></div><div class="tile empty" id="cell-6"><span id="value-6">0</span></div><div class="tile empty" id="cell-7"><span id="value-7">0</span></div></div>
    <div class="row"><div class="tile empty" id="cell-8"><span id="value-8">0</span></div><div class="tile empty" id="cell-9"><span id="value-9">0</span></div><div class="tile empty" id="cell-10"><span id="value-10">0</span></div><div class="tile empty" id="cell-11"><span id="value-11">0</span></div></div>
    <div class="row"><div class="tile empty" id="cell-12"><span id="value-12">0</span></div><div class="tile empty" id="cell-13"><span id="value-13">0</span></div><div class="tile empty" id="cell-14"><span id="value-14">0</span></div><div class="tile empty" id="cell-15"><span id="value-15">0</span></div></div>
    <div class="overlay" id="overlay" hidden>
      <h2 id="result-title">你拼出了 2048！</h2>
      <p id="result-description">继续向更大的数字进发吧。</p>
      <div class="overlay-actions"><button id="continue" type="button">继续挑战</button><button id="retry" type="button">重新开始</button></div>
    </div>
  </div>
  <div class="directions" aria-label="移动方向">
    <button id="left" type="button" aria-label="向左">←</button><button id="up" type="button" aria-label="向上">↑</button><button id="down" type="button" aria-label="向下">↓</button><button id="right" type="button" aria-label="向右">→</button>
  </div>
  <p class="hint">方向键 / WASD · 在棋盘上滑动 · 点击方向按钮</p>
  <p class="status" id="status" role="status">合并相同数字，向 2048 前进。</p>
</main>
</body>
</html>
