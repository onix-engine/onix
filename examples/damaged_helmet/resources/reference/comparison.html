<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>three.js / Onix — DamagedHelmet 对照</title>
<style>
  body { margin: 0; background: #202020; color: white; font: 14px sans-serif; }
  canvas { display: block; }
  #controls { position: fixed; top: 12px; left: 12px; padding: 10px; background: #202020dd; }
  #status { display: block; margin-top: 8px; }
</style>
<div id="controls">
  <span>原始 Ultra HDR JPEG</span>
  <button id="reset" type="button">重置参考视角</button>
  <span id="status" role="status">正在加载…</span>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://threejs.org/build/three.module.js",
    "three/addons/": "https://threejs.org/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { UltraHDRLoader } from 'three/addons/loaders/UltraHDRLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const status = document.querySelector('#status');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, .25, 20);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  const helmet = (await new GLTFLoader().loadAsync('../models/DamagedHelmet.glb')).scene;
  scene.add(helmet);
  function reset() {
    // Drain and clear the previous damping before writing the reference pose.
    controls.enableDamping = false;
    controls.update();
    camera.position.set(-1.8, .6, 2.7);
    controls.target.set(0, 0, -.2);
    const box = new THREE.Box3().setFromObject(helmet);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const distance = 1.3 * Math.max(size.x, size.y, size.z) / (2 * Math.atan(Math.PI * camera.fov / 360));
    const direction = controls.target.clone().sub(camera.position).normalize().multiplyScalar(distance);
    controls.target.copy(center);
    controls.minDistance = distance / 10;
    controls.maxDistance = distance * 10;
    camera.near = distance / 100;
    camera.far = distance * 100;
    camera.position.copy(center).sub(direction);
    camera.updateProjectionMatrix();
    controls.update();
    controls.enableDamping = true;
  }
  const texture = await new UltraHDRLoader().loadAsync('../environment/royal_esplanade_2k.hdr.jpg');
  texture.mapping = THREE.EquirectangularReflectionMapping;
  function setEnvironment() {
    scene.background = scene.environment = texture;
    status.textContent = `three.js r${THREE.REVISION} · ${renderer.domElement.width}×${renderer.domElement.height} · ACES / exposure 1`;
  }
  document.querySelector('#reset').addEventListener('click', reset);
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    setEnvironment();
  });
  reset();
  setEnvironment();
  renderer.setAnimationLoop(() => {
    controls.update();
    renderer.render(scene, camera);
  });
} catch (error) {
  renderer?.dispose();
  status.textContent = `加载失败：${error.message}`;
  console.error(error);
}
</script>
</html>
