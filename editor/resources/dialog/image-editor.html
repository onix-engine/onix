<div id="dialog-root" data-ref="root" class="dialog-root">
  <div id="overlay" data-ref="overlay" aria-hidden="true"></div>
  <section id="panel" data-ref="panel" role="dialog" aria-modal="true" aria-labelledby="image-editor-title">
    <div id="content" data-ref="content">
      <h2 id="image-editor-title" data-ref="image-editor-title"></h2>
      <span id="image-editor-size" data-ref="image-editor-size" hidden></span>
      <div id="image-editor-background" data-ref="image-editor-background" aria-hidden="true" hidden></div>
      <img id="image-editor-preview" data-ref="image-editor-preview" alt="Image preview" hidden>
      <button id="image-editor-rotate" data-ref="image-editor-rotate" type="button" hidden>
        <span id="image-editor-rotate-label" data-ref="image-editor-rotate-label">Rotate 90°</span>
      </button>
      <button id="image-editor-flip-h" data-ref="image-editor-flip-h" type="button" hidden>
        <span id="image-editor-flip-h-label" data-ref="image-editor-flip-h-label">Flip H</span>
      </button>
      <button id="image-editor-flip-v" data-ref="image-editor-flip-v" type="button" hidden>
        <span id="image-editor-flip-v-label" data-ref="image-editor-flip-v-label">Flip V</span>
      </button>
      <button id="image-editor-reset" data-ref="image-editor-reset" type="button" hidden>
        <span id="image-editor-reset-label" data-ref="image-editor-reset-label">Reset</span>
      </button>
      <button id="image-editor-save" data-ref="image-editor-save" type="button" hidden>
        <span id="image-editor-save-label" data-ref="image-editor-save-label">Save PNG Copy</span>
      </button>
      <button id="image-editor-close" data-ref="image-editor-close" type="button" aria-label="Close dialog">
        <img id="image-editor-close-icon" data-ref="image-editor-close-icon" alt="">
        <span id="image-editor-close-label" data-ref="image-editor-close-label"></span>
      </button>
    </div>
  </section>
</div>
<style>
  * { box-sizing: border-box }
  .dialog-root {
    position: absolute; inset: 0; overflow: hidden;
    font: 14px sans-serif; color: #dce0e8;
  }
  #overlay { position: absolute; inset: 0; background: rgba(10,12,18,.72) }
  #panel {
    position: absolute; z-index: 1; overflow: hidden;
    border: 1px solid #3b404b; border-radius: 10px;
    background: #2a2e37; box-shadow: 0 18px 48px rgba(0,0,0,.38);
  }
  #content { position: absolute; inset: 0; pointer-events: none }
  #image-editor-title {
    margin: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    font-size: 20px; font-weight: 600; line-height: 26px;
  }
  #image-editor-size { color: #aeb7c7 }
  #image-editor-background {
    background: #20242b conic-gradient(#353b46 25%, #20242b 0 50%, #353b46 0 75%, #20242b 0) 0 0 / 16px 16px repeat;
  }
  #content button {
    display: flex; align-items: center; justify-content: center; pointer-events: auto;
    padding: 0 4px; border: 1px solid transparent; border-radius: 5px;
    background: #343a46; color: #dce0e8; font: 13px sans-serif; cursor: pointer;
  }
  #content button[hidden] { display: none }
  #content button:not(:disabled):hover, #content button:not(:disabled):focus-visible {
    border-color: #84ccff; background: #3b5266; outline: none;
  }
  #content button:disabled { opacity: .45; cursor: default }
  #content .icon-only { padding: 0; background: transparent }
  #image-editor-close-icon { width: 16px; height: 16px }
</style>
