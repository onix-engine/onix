<div id="dialog-root" data-ref="root" class="dialog-root"><div id="overlay" data-ref="overlay" aria-hidden="true"></div><section id="panel" data-ref="panel" role="dialog" aria-modal="true" aria-labelledby="progress-title"><div id="content" data-ref="content"><span id="progress-title" data-ref="progress-title" class="dialog-label dialog-title"></span><span id="progress-message" data-ref="progress-message" class="dialog-label"></span><div id="progress-bar-bg" data-ref="progress-bar-bg" role="progressbar" aria-label="Build progress" aria-valuemin="0" aria-valuemax="100"></div><div id="progress-bar" data-ref="progress-bar"></div><div id="progress-activity" data-ref="progress-activity" aria-hidden="true"></div><span id="progress-detail" data-ref="progress-detail" class="dialog-label"></span><textarea id="dialog-field-progress-log" data-ref="dialog-field-progress-log" readonly aria-label="Build and resource log"></textarea></div></section></div><style>
*{box-sizing:border-box}
.dialog-root{position:absolute;inset:0;margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:sans-serif;color:#dce0e8}
