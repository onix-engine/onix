<div id="welcome-root" data-ref="root" class="welcome-root">
  <div id="overlay" data-ref="overlay" aria-hidden="true"></div>
  <section id="panel" data-ref="panel" role="dialog" aria-modal="true" aria-labelledby="welcome-title">
    <div id="content" data-ref="content">
      <img id="welcome-logo" data-ref="logo" alt="Onix">
      <span id="welcome-title" data-ref="title" class="dialog-label">Onix Editor</span>
      <span id="welcome-section" data-ref="section" class="dialog-label">Recent Projects</span>
      <span id="welcome-empty" data-ref="empty" hidden class="dialog-label">No recent projects yet.</span>
      <div id="welcome-recent" data-ref="recent"></div>
      <button id="welcome-close" data-ref="close" class="icon-only" type="button" aria-label="Close">
        <img id="welcome-close-icon" class="dialog-button-icon" alt="" src="onix-titlebar/close.svg">
      </button>
      <button id="welcome-new" data-ref="new" type="button">
        <img id="welcome-new-icon" class="dialog-button-icon" src="onix-titlebar/plus.svg" alt="">
        <span id="welcome-new-label" class="dialog-button-label">New Project</span>
      </button>
      <button id="welcome-open" data-ref="open" class="active" type="button">
        <img id="welcome-open-icon" class="dialog-button-icon" src="onix-titlebar/open.svg" alt="">
        <span id="welcome-open-label" class="dialog-button-label">Open Project</span>
      </button>
    </div>
  </section>
</div>
<style>
*{box-sizing:border-box}
.welcome-root{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;font-family:sans-serif;color:#dce0e8}
#overlay{position:absolute;inset:0;z-index:0;background:rgba(10,12,18,.72);pointer-events:auto}
#panel{position:absolute;z-index:1;border:1px solid #3b404b;border-radius:10px;background:#2a2e37;box-shadow:0 18px 48px rgba(0,0,0,.38);pointer-events:auto;overflow:hidden}
#content{position:absolute;z-index:1;inset:0;pointer-events:none}
#content>*{position:absolute}
#content button{display:flex;align-items:center;justify-content:center;gap:8px;pointer-events:auto;margin:0;padding:0 12px;border:1px solid transparent;border-radius:5px;background:#343a46;color:#dce0e8;font:14px sans-serif;line-height:1;cursor:pointer}
#content button:not(:disabled):hover,#content button:not(:disabled):active,#content button.active:not(:disabled),#content button:not(:disabled):focus-visible{border-color:#84ccff;background:#3b5266;outline:none}
#content button.icon-only{padding:0;background:transparent}
#content button.icon-only:not(:disabled):hover,#content button.icon-only:not(:disabled):active,#content button.icon-only:not(:disabled):focus-visible{border-color:#84ccff;background:#3b5266;outline:none}
#content .dialog-button-icon{width:16px;height:16px;flex:0 0 16px;object-fit:contain}
#content .dialog-button-label{line-height:1;white-space:nowrap}
#content .dialog-label{pointer-events:none}
#welcome-logo{left:24px;top:22px;width:56px;height:56px;object-fit:contain}
#welcome-title{left:96px;top:24px;width:calc(100% - 144px);height:32px;font-size:24px;line-height:32px;color:#e7ebf3}
#welcome-section{left:24px;top:104px;width:calc(100% - 48px);height:24px;font-size:16px;line-height:24px;color:#e7ebf3}
#welcome-empty{left:24px;top:151px;width:calc(100% - 48px);height:22px;font-size:14px;line-height:22px;color:#aab4c4}
#welcome-recent{position:absolute;inset:0;pointer-events:none}
#welcome-close{right:12px;top:12px;width:32px;height:32px;padding:0;font-size:22px}
#welcome-new,#welcome-open{bottom:20px;height:28px}
#welcome-new{right:calc(24px + 123px + 12px);width:123px}
#welcome-open{right:24px;width:123px}
.welcome-recent-row{position:absolute;pointer-events:none}
.welcome-row-button{position:absolute;inset:0;width:100%;height:100%;justify-content:flex-start!important;padding:0 42px!important;text-align:left}
.welcome-row-icon{position:absolute;left:14px;top:13px;width:16px;height:16px}
.welcome-row-name{position:absolute;left:42px;right:42px;top:4px;height:18px;overflow:hidden;color:#e7ebf3;font-size:14px;line-height:18px;white-space:nowrap;text-overflow:ellipsis}
.welcome-row-path{position:absolute;left:42px;right:42px;top:23px;height:16px;overflow:hidden;color:#aab4c4;font-size:12px;line-height:16px;white-space:nowrap;text-overflow:ellipsis}
.welcome-row-remove{position:absolute;right:8px;top:8px;width:24px;height:24px;padding:0!important;background:transparent}
.welcome-row-remove:hover,.welcome-row-remove:active,.welcome-row-remove:focus-visible{border-color:#84ccff;background:#3b5266;outline:none}
.welcome-row-remove img{width:16px;height:16px;object-fit:contain}
</style>
