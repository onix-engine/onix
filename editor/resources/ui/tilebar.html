<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Onix Editor Titlebar</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; font-size: 14px; color: #dce0e8; }
    button { display: flex; align-items: center; justify-content: center; margin: 0; padding: 0; height: 24px; border: 1px solid transparent; border-radius: 5px; background: transparent; color: #dce0e8; font: inherit; white-space: nowrap; cursor: pointer; }
    button:not(.window-control):not(:disabled):hover, button:not(.window-control):not(:disabled):active, button.active:not(.window-control):not(:disabled), button.open:not(.window-control):not(:disabled), button.dirty:not(.window-control):not(:disabled), button.running:not(.window-control):not(:disabled), button:not(.window-control):not(:disabled):focus-visible { border-color: #84ccff; background: #3b5266; outline: none; }
    button:disabled { color: #737985; background: transparent; cursor: default; }
    button:disabled img { opacity: 0.4; }
    img { display: block; width: 16px; height: 16px; flex-shrink: 0; }
    .titlebar { position: relative; width: 100%; height: 38px; border: 1px solid #3d434f; border-radius: 8px; background: #20232b; user-select: none; }
    .menus { position: absolute; left: 16px; top: 0; display: flex; align-items: center; gap: 4px; height: 36px; }
    .native-controls .menus { left: 80px; }
    .menu { position: relative; display: flex; align-items: center; height: 36px; }
    .menus button { border: 0; }
    .menu-trigger { padding: 0 8px; color: #b0b7c3; }
    .tools { position: absolute; left: 50%; top: 6px; margin-left: -88px; display: flex; align-items: center; width: 176px; height: 24px; }
    /* Transparent gradient forces the raster border path so square-cornered buttons
       paint edges; side borders use the bar color so seams read as solid, not gaps. */
    .tool { width: 36px; flex-shrink: 0; border-radius: 0; border-top-color: #3d434f; border-bottom-color: #3d434f; border-left-color: #20232b; border-right-color: #20232b; background-image: linear-gradient(transparent, transparent); }
    .tool + .tool { margin-left: -1px; }
    .tool:first-child { border-left-color: #3d434f; border-radius: 5px 0 0 5px; }
    .tool:last-child { border-right-color: #3d434f; border-radius: 0 5px 5px 0; }
    /* Highlighted tools blend the border into the fill so the block keeps its size. */
    button.tool:hover:not(:disabled), button.tool:active:not(:disabled), button.tool:not(:disabled):focus-visible, button.tool.dirty:not(:disabled), button.tool.running:not(:disabled) { border-color: #3b5266; }
    .tool-text { font-size: 12px; font-weight: 600; letter-spacing: .5px; }
    .window-controls { position: absolute; right: 0; top: 0; display: flex; width: 138px; height: 36px; }
    .window-control { width: 46px; height: 36px; flex-shrink: 0; border: 0; border-radius: 0; }
    .window-control:hover { background: #343842; }
    .window-control:active { background: #465063; }
    .window-control:focus-visible { outline: 1px solid #84ccff; outline-offset: -1px; }
    .window-close { border-radius: 0 7px 7px 0; }
    .window-close:hover, .window-close:active { background: #c42b34; }
    .popup { position: absolute; left: 0; top: 36px; z-index: 500; width: 300px; padding: 4px; border: 1px solid #3b404b; border-radius: 8px; background: #2a2e37; }
    .menu-item { justify-content: flex-start; gap: 8px; width: 100%; height: 28px; padding: 0 10px; text-align: left; }
    .menu-item.danger { color: #c45b68; }
    .menu-label { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .shortcut { margin-left: auto; font-size: 12px; color: #8992a2; }
    .empty-state { margin: 0; padding: 6px 10px; height: 28px; line-height: 16px; color: #8992a2; }
    .submenu-row { position: relative; }
    .recent-popup-anchor { position: absolute; left: 100%; top: -5px; z-index: 520; }
    .recent-popup { position: relative; left: 0; top: 0; flex-direction: column; width: auto; max-width: calc(100vw - 319px); z-index: 520; }
    .recent-popup:not([hidden]) { display: inline-flex; }
    .native-controls .recent-popup { max-width: calc(100vw - 383px); }
    .recent-popup .menu-item { width: auto; }
    @media (max-width: 760px) { .recent-popup-anchor { position: fixed; left: 8px; top: 96px; } .recent-popup, .native-controls .recent-popup { max-width: calc(100vw - 16px); } }
    @media (max-width: 640px) { .menu-trigger { padding: 0 4px; } .menus { left: 8px; gap: 0; } .tools { left: auto; right: 138px; margin-left: 0; } .native-controls .tools { right: 0; } }
  </style>
</head>
<body>
  <header id="titlebar" data-ref="titlebar" class="titlebar">
    <nav class="menus" aria-label="Editor menus">
      <div class="menu" id="menu-host-file" data-ref="menu-host-file">
        <button type="button" class="menu-trigger" id="menu-file" data-ref="menu-file" aria-expanded="false" aria-controls="popup-file">File</button>
        <div class="popup" id="popup-file" data-ref="popup-file" hidden>
          <button type="button" class="menu-item" id="file.open-project" data-ref="file.open-project"><img src="onix-titlebar/open.svg" alt=""><span class="menu-label">Open Project</span></button>
          <div class="submenu-row">
            <button type="button" class="menu-item" id="file.open-recent-project" data-ref="file.open-recent-project" aria-expanded="false" aria-controls="popup-recent"><img src="onix-titlebar/folder.svg" alt=""><span class="menu-label">Open Recent Project</span><img src="onix-titlebar/arrow.svg#right" alt=""></button>
            <div class="recent-popup-anchor">
              <div class="popup recent-popup" id="popup-recent" data-ref="popup-recent" hidden>
                <p class="empty-state" id="recent-empty" data-ref="recent-empty">No Recent Projects</p>
              </div>
            </div>
          </div>
          <button type="button" class="menu-item" id="file.new-project" data-ref="file.new-project"><img src="onix-titlebar/plus.svg" alt=""><span class="menu-label">New Project</span></button>
          <button type="button" class="menu-item" id="file.save" data-ref="file.save"><img src="onix-titlebar/save.svg" alt=""><span class="menu-label">Save Project</span><span class="shortcut">Ctrl+S</span></button>
          <button type="button" class="menu-item" id="file.reload" data-ref="file.reload"><img src="onix-titlebar/reload.svg" alt=""><span class="menu-label">Reload From Disk</span><span class="shortcut">F5</span></button>
          <button type="button" class="menu-item" id="file.close-project" data-ref="file.close-project"><img src="onix-titlebar/close.svg" alt=""><span class="menu-label">Close Project</span></button>
          <button type="button" class="menu-item" id="file.preferences" data-ref="file.preferences"><img src="onix-titlebar/setting.svg" alt=""><span class="menu-label">Preferences</span></button>
        </div>
      </div>
      <div class="menu" id="menu-host-edit" data-ref="menu-host-edit">
        <button type="button" class="menu-trigger" id="menu-edit" data-ref="menu-edit" aria-expanded="false" aria-controls="popup-edit">Edit</button>
        <div class="popup" id="popup-edit" data-ref="popup-edit" hidden>
          <button type="button" class="menu-item" id="edit.project-settings" data-ref="edit.project-settings"><img src="onix-titlebar/setting.svg" alt=""><span class="menu-label">Project Settings</span></button>
          <button type="button" class="menu-item" id="edit.undo" data-ref="edit.undo"><img src="onix-titlebar/undo.svg" alt=""><span class="menu-label">Undo</span><span class="shortcut">Ctrl+Z</span></button>
          <button type="button" class="menu-item" id="edit.redo" data-ref="edit.redo"><img src="onix-titlebar/redo.svg" alt=""><span class="menu-label">Redo</span><span class="shortcut">Ctrl+Y</span></button>
          <button type="button" class="menu-item" id="edit.toggle-grid-snap" data-ref="edit.toggle-grid-snap"><img src="onix-titlebar/grid.svg" alt=""><span class="menu-label">Toggle Grid Snap</span><span class="shortcut">Ctrl+G</span></button>
          <button type="button" class="menu-item" id="edit.select-all" data-ref="edit.select-all"><img src="onix-titlebar/group.svg" alt=""><span class="menu-label">Select All Game Objects</span><span class="shortcut">Ctrl+A</span></button>
          <button type="button" class="menu-item danger" id="edit.delete" data-ref="edit.delete"><img src="onix-titlebar/trash-2.svg#danger" alt=""><span class="menu-label">Delete Selected</span><span class="shortcut">Del</span></button>
        </div>
      </div>
      <div class="menu" id="menu-host-debug" data-ref="menu-host-debug">
        <button type="button" class="menu-trigger" id="menu-debug" data-ref="menu-debug" aria-expanded="false" aria-controls="popup-debug">Debug</button>
        <div class="popup" id="popup-debug" data-ref="popup-debug" hidden>
          <button type="button" class="menu-item" id="debug.run" data-ref="debug.run"><img src="onix-titlebar/play.svg" alt=""><span class="menu-label">Run</span><span class="shortcut">F6</span></button>
          <button type="button" class="menu-item" id="debug.build" data-ref="debug.build"><img src="onix-titlebar/build.svg" alt=""><span class="menu-label">Build</span></button>
          <button type="button" class="menu-item" id="debug.rebuild-preview" data-ref="debug.rebuild-preview"><img src="onix-titlebar/reload.svg" alt=""><span class="menu-label">Rebuild Preview</span></button>
          <button type="button" class="menu-item" id="debug.focus" data-ref="debug.focus"><img src="onix-titlebar/focus.svg" alt=""><span class="menu-label">Focus</span></button>
        </div>
      </div>
      <div class="menu" id="menu-host-about" data-ref="menu-host-about">
        <button type="button" class="menu-trigger" id="menu-about" data-ref="menu-about" aria-expanded="false" aria-controls="popup-about">About</button>
        <div class="popup" id="popup-about" data-ref="popup-about" hidden>
          <button type="button" class="menu-item" id="about.show" data-ref="about.show"><img src="onix-titlebar/info.svg" alt=""><span class="menu-label">About Onix Editor</span><span class="shortcut">Esc closes</span></button>
        </div>
      </div>
    </nav>
    <div class="tools" role="group" aria-label="Editor actions">
      <button type="button" class="tool" id="top-run" data-ref="top-run" title="Run (F6)" aria-label="Run project" disabled><img id="run-icon" data-ref="run-icon" src="onix-titlebar/play.svg" alt=""></button>
      <button type="button" class="tool" id="top-save" data-ref="top-save" title="Save (Ctrl+S)" aria-label="Save project"><img src="onix-titlebar/save.svg" alt=""></button>
      <button type="button" class="tool" id="top-reload" data-ref="top-reload" title="Reload (F5)" aria-label="Reload from disk"><img src="onix-titlebar/reload.svg" alt=""></button>
      <button type="button" class="tool" id="top-frame" data-ref="top-frame" title="Focus" aria-label="Focus canvas"><img src="onix-titlebar/focus.svg" alt=""></button>
      <button type="button" class="tool tool-text" id="top-dimension" data-ref="top-dimension" title="Switch to 3D view" aria-label="Switch to 3D view" disabled>2D</button>
    </div>
    <div class="window-controls" id="window-controls" data-ref="window-controls" role="group" aria-label="Window controls">
      <button type="button" class="window-control" id="window-minimize" data-ref="window-minimize" title="Minimize" aria-label="Minimize window"><img src="onix-titlebar/minimize.svg" alt=""></button>
      <button type="button" class="window-control" id="window-maximize" data-ref="window-maximize" title="Maximize / Restore" aria-label="Maximize or restore window"><img src="onix-titlebar/maximize.svg" alt=""></button>
      <button type="button" class="window-control window-close" id="window-close" data-ref="window-close" title="Close" aria-label="Close window"><img src="onix-titlebar/close.svg" alt=""></button>
    </div>
  </header>
</body>
</html>
