<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Compat;src:url("../../../testdata/fonts/Noto_Sans_SC/static/NotoSansSC-Regular.ttf")}html,body{margin:0;padding:0}body{background:#fff;font-family:Compat;font-size:16px}.case{position:absolute;width:180px;height:110px;background:#f1f5f9}.probe{background:#38bdf8;box-sizing:border-box}.scroll-content{width:240px;height:180px;background:linear-gradient(to right,#f97316,#22c55e,#a855f7)}.scroll-y{width:120px;height:80px;overflow-y:scroll;overflow-x:hidden}.scroll-x{width:120px;height:80px;overflow-x:scroll;overflow-y:hidden}.scroll-both{width:120px;height:80px;overflow:scroll}.scroll-thin{width:120px;height:80px;overflow:scroll;scrollbar-width:thin;scrollbar-color:#0f766e #d1fae5}.opacity-parent{width:150px;height:80px;background:#2563eb;opacity:.55}.opacity-parent>div{width:110px;height:60px;background:#f97316}.opacity-deep{width:150px;height:80px;background:#2563eb;opacity:.7}.opacity-deep>div{width:120px;height:65px;background:#f97316;opacity:.6}.opacity-deep>div>div{width:80px;height:45px;background:#22c55e;opacity:.5}.radius-overflow{width:130px;height:80px;border-radius:24px;overflow:hidden;background:#0f172a}.radius-overflow>div{width:190px;height:120px;background:linear-gradient(135deg,#f97316,#22c55e,#3b82f6)}.radius-text{width:130px;height:80px;border-radius:24px;overflow:hidden;background:#e2e8f0}.radius-text>div{position:relative;left:-18px;top:20px;width:180px;height:40px;background:#f97316;color:#111827;white-space:nowrap}</style></head><body>
