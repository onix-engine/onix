<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Compat;src:url("../../../testdata/fonts/Noto_Sans_SC/static/NotoSansSC-Regular.ttf")}html,body{margin:0;padding:0}body{background:white;font-family:Compat;font-size:16px} .case{position:absolute;width:180px;height:110px;background:#f1f5f9} .probe{background:#38bdf8}.probe>div{background:#f97316}.probe>div+div{background:#22c55e}.probe>div+div+div{background:#a855f7}</style></head><body>
<div class="case" id="case-border-colors" style="left:10px;top:10px"><div class="probe" id="border-colors" style="width:120px;height:60px;border:8px solid;border-color:#ef4444 #22c55e #a855f7 #172554"></div></div>
<div class="case" id="case-border-widths" style="left:210px;top:10px"><div class="probe" id="border-widths" style="width:120px;height:60px;border:solid #172554;border-width:2px 6px 10px 14px"></div></div>
<div class="case" id="case-radius-corners" style="left:410px;top:10px"><div class="probe" id="radius-corners" style="width:140px;height:80px;border-radius:0 20px 30px 10px"></div></div>
<div class="case" id="case-radius-pill" style="left:610px;top:10px"><div class="probe" id="radius-pill" style="width:140px;height:60px;border-radius:999px"></div></div>
<div class="case" id="case-background-content" style="left:810px;top:10px"><div class="probe" id="background-content" style="width:110px;height:50px;padding:12px;border:4px solid #172554;background-clip:content-box"></div></div>
<div class="case" id="case-background-padding" style="left:1010px;top:10px"><div class="probe" id="background-padding" style="width:110px;height:50px;padding:12px;border:4px dashed #172554;background-clip:padding-box"></div></div>
<div class="case" id="case-overflow-nested" style="left:10px;top:140px"><div class="probe" id="overflow-nested" style="width:140px;height:80px;overflow:hidden"><div id="overflow-nested-child-0" style="width:100px;height:60px;overflow:hidden;margin-left:30px"><div id="overflow-nested-child-1" style="width:140px;height:100px;background:#a855f7"></div></div></div></div>
<div class="case" id="case-overflow-relative" style="left:210px;top:140px"><div class="probe" id="overflow-relative" style="width:120px;height:70px;overflow:hidden"><div id="overflow-relative-child-0" style="position:relative;left:40px;top:20px;width:120px;height:70px"></div></div></div>
<div class="case" id="case-background-linear" style="left:410px;top:140px"><div class="probe" id="background-linear" style="width:140px;height:80px;background:linear-gradient(to right,#ef4444,#3b82f6)"></div></div>
<div class="case" id="case-background-stops" style="left:610px;top:140px"><div class="probe" id="background-stops" style="width:140px;height:80px;background:linear-gradient(to bottom,#ef4444 0%,#ef4444 50%,#3b82f6 50%,#3b82f6 100%)"></div></div>
<div class="case" id="case-border-double" style="left:810px;top:140px"><div class="probe" id="border-double" style="width:130px;height:60px;border:9px double #172554"></div></div>
<div class="case" id="case-shadow-solid" style="left:1010px;top:140px"><div class="probe" id="shadow-solid" style="width:120px;height:60px;margin:10px;box-shadow:8px 6px 0 2px #172554"></div></div>
</body></html>
